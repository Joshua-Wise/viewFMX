name: build

# Builds the two viewFMX images (SPA/nginx + api-server), pushes them to
# GHCR, then pins docker-compose.yml to the new tag. Arcane syncs this repo,
# so the committed tag IS the deployed version — the bump commit is the deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      # The last step of this workflow commits docker-compose.yml. Without
      # this the bump commit would retrigger the build, forever.
      - 'docker-compose.yml'
      - 'README.md'
      - 'LICENSE'
      - 'screenshots/**'
  workflow_dispatch:

# contents: write → commit the tag bump back to main
# packages: write → push to ghcr.io
permissions:
  contents: write
  packages: write

concurrency:
  # Serialize: two builds racing to commit docker-compose.yml would conflict.
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR rejects uppercase path segments; the owner is "Joshua-Wise".
  IMAGE_UI: ghcr.io/joshua-wise/viewfmx
  IMAGE_API: ghcr.io/joshua-wise/viewfmx-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Default ref (the pushed commit) is deliberate: the images must contain
      # exactly the code that GITHUB_SHA names, since that SHA becomes the tag.
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # VITE_* values are compiled into the SPA bundle at build time, so they
      # cannot come from the deployed .env. They are non-secret (a URL path and
      # a status filter), so a repository *variable* is the right home; the
      # fallbacks match the defaults in src/services/gofmxService.js.
      # GOFMX_TOKEN is deliberately NOT here — it stays runtime-only, injected
      # into nginx.conf by docker/docker-entrypoint.sh.
      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
            VITE_GOFMX_STATUS=${{ vars.VITE_GOFMX_STATUS || 'FinalizedUpcoming' }}
          tags: |
            ${{ env.IMAGE_UI }}:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE_UI }}:latest
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
          provenance: false

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api-server
          file: ./api-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: false

      - name: Pin docker-compose.yml to the new tag
        env:
          SHA: ${{ steps.vars.outputs.sha }}
        run: |
          set -euo pipefail
          sed -i -E "s|^(\s*image:\s*)${IMAGE_UI}:.*$|\1${IMAGE_UI}:${SHA}|" docker-compose.yml
          sed -i -E "s|^(\s*image:\s*)${IMAGE_API}:.*$|\1${IMAGE_API}:${SHA}|" docker-compose.yml
          if git diff --quiet -- docker-compose.yml; then
            echo "docker-compose.yml already pinned to ${SHA}; nothing to commit"
            exit 0
          fi
          grep -n "ghcr.io/joshua-wise/viewfmx" docker-compose.yml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          git commit -m "deploy: viewfmx:${SHA} [skip ci]"
          # Another push may have landed while the images built.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
