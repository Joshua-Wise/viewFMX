# Deployed by Arcane, which syncs this repo. The image tags below are rewritten
# to the new commit SHA by .github/workflows/build.yml, so those lines are the
# deployed version — do not edit them by hand except to roll back to an older
# SHA tag.
#
# Compose derives the project name (and therefore container names) from the
# directory it runs in unless told otherwise. This file used to live in
# docker/, which is why containers came up as "docker-app-1". The explicit
# name + container_name below pin the names regardless of checkout path.
name: viewfmx

services:
  # Express service backing /device/v1/ for the ESP32 / embedded clients.
  # Not published on the host: only the ui container reaches it, over the
  # compose network, by its service name.
  api-server:
    image: ghcr.io/joshua-wise/viewfmx-api:sha-c684332
    container_name: viewfmx-api
    expose:
      - "3001"
    environment:
      - GOFMX_TOKEN=${GOFMX_TOKEN}
      # server.js reads GOFMX_API_BASE; .env spells the same URL
      # NGINX_PROXY_PASS for the nginx side.
      - GOFMX_API_BASE=${NGINX_PROXY_PASS}
      - VITE_GOFMX_STATUS=${VITE_GOFMX_STATUS:-FinalizedUpcoming}
    restart: unless-stopped

  # nginx serving the compiled SPA, proxying /api/v1/ to FMX and /device/v1/
  # to api-server. GOFMX_TOKEN is substituted into nginx.conf at container
  # start by docker/docker-entrypoint.sh, never baked into the image.
  ui:
    image: ghcr.io/joshua-wise/viewfmx:sha-c684332
    container_name: viewfmx-ui
    depends_on:
      - api-server
    ports:
      # 3000 is taken by the openspeedtest stack on the Arcane host.
      - "${UI_PORT:-3030}:80"
    env_file: .env
    environment:
      - GOFMX_TOKEN=${GOFMX_TOKEN}
      - NGINX_PROXY_PASS=${NGINX_PROXY_PASS}
      - NGINX_PROXY_HOST=${NGINX_PROXY_HOST}
    volumes:
      # Optional custom logo. A logo.png (or .svg/.jpg/.jpeg/.webp) in this
      # directory is served at /logo.png instead of the bundled one; with the
      # directory empty or absent, the bundled logo is used. Absolute on
      # purpose: Arcane runs compose from inside its own container, where a
      # relative path would not resolve to the host, and its Git Sync owns
      # /opt/stacks/viewfmx. Override with CUSTOM_LOGO_DIR in .env.
      - ${CUSTOM_LOGO_DIR:-/opt/viewfmx/branding}:/usr/share/nginx/html/custom:ro
    restart: unless-stopped

# Both containers are otherwise stateless; the branding mount above is the
# only volume.
