events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Security headers applied to all responses
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        # Static content
        root /usr/share/nginx/html;
        index index.html;

        # Device JSON API (ESP32 / embedded clients) — proxied to api-server
        location /device/v1/ {
            proxy_pass http://api-server:3001/device/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
        }

        # API proxy location
        location /api/v1/ {
            proxy_pass ${NGINX_PROXY_PASS};
            proxy_set_header Host ${NGINX_PROXY_HOST};
            proxy_set_header Authorization "Basic ${GOFMX_TOKEN}";

            # Prevent authentication prompts and fingerprinting
            proxy_hide_header WWW-Authenticate;
            proxy_hide_header X-Powered-By;
            proxy_hide_header X-AspNet-Version;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            error_page 401 403 = @auth_error;
        }

        # Custom error handler for authentication errors
        location @auth_error {
            return 302 /auth-error.html;
        }

        # Serve the auth error page
        location = /auth-error.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # iOS 9 compatible version
        location /ios9 {
            try_files /ios9-compatible.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Default location
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
